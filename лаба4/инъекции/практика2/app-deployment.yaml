apiVersion: apps/v1
kind: Deployment
metadata:
  name: labatamiya
spec:
  replicas: 3
  selector:
    matchLabels:
      app: labatamiya
  template:
    metadata:
      labels:
        app: labatamiya
    spec:
      containers:
        - name: labatamiya
          image: labatamiya
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "1337"
            - name: MYSQL_USER
              value: "root"
            - name: MYSQL_PASSWORD
              value: "root"
            - name: MYSQL_DBNAME
              value: "practic2"
            - name: MYSQL_HOST
              value: "db"
            - name: MYSQL_PORT
              value: "3306"
            - name: TOKEN
              value: "super-puper-secret"
            - name: JWT_SECRET
              value: "$2b$10$GVP56WuVE56Rk.nEbSb9AOlXWpu08969CXG9hShDF0NiHb2LxtzuS"
---
apiVersion: v1
kind: Service
metadata:
  name: labatamiya
spec:
  selector:
    app: labatamiya
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
